name: Deploy / staging

# Runs when a pull request is merged to main. The full test suites run again on the merge commit and
# must pass before anything is built or deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  backend-ci:
    uses: ./.github/workflows/ci-backend.yml
  frontend-ci:
    uses: ./.github/workflows/ci-frontend.yml

  build:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.names.outputs.backend }}
      web_image: ${{ steps.names.outputs.web }}
    steps:
      - uses: actions/checkout@v5
      - id: names
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=${repo}/backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web=${repo}/web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          target: production
          push: true
          tags: ${{ steps.names.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/web/Dockerfile
          target: production
          push: true
          tags: ${{ steps.names.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.STAGING_SSH_PORT || 22 }}" "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts
      - name: Sync compose files
        run: |
          scp -i ~/.ssh/id_deploy -P "${{ secrets.STAGING_SSH_PORT || 22 }}" \
            deploy/staging/compose.yaml deploy/staging/Caddyfile \
            "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:${{ vars.STAGING_PATH || '/opt/alojeiri' }}/"
      - name: Pull, migrate, restart
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.STAGING_SSH_PORT || 22 }}" \
            "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" bash -se <<'REMOTE'
          set -euo pipefail
          cd "${{ vars.STAGING_PATH || '/opt/alojeiri' }}"
          export BACKEND_IMAGE="${{ needs.build.outputs.backend_image }}"
          export WEB_IMAGE="${{ needs.build.outputs.web_image }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull
          docker compose up -d db
          docker compose run --rm backend python manage.py migrate --noinput
          docker compose up -d --remove-orphans
          docker image prune -f
          REMOTE
