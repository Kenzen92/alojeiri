name: CI / backend

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alojeiri
          POSTGRES_USER: alojeiri
          POSTGRES_PASSWORD: alojeiri
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alojeiri" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://alojeiri:alojeiri@localhost:5432/alojeiri
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: uv run pytest --cov --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
