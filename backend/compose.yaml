# Local development stack:  docker compose up   (or `make up` from the repo root)
name: alojeiri-backend

services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env.example
      - path: .env
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: dev
    env_file:
      - .env.example
      - path: .env
        required: false
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app            # live code reload; the venv lives in /opt/venv inside the image
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:              # `docker compose up --watch` rebuilds when dependencies change
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock

volumes:
  pgdata:
