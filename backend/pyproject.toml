[project]
name = "alojeiri-backend"
version = "0.1.0"
description = "Al Ojeiri platform backend: Django REST API"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.18,<3.19",
    "django-cors-headers>=4.9",
    "django-environ>=0.14",
    "drf-spectacular>=0.30",
    "gunicorn>=26",
    "psycopg[binary]>=3.3",
    "whitenoise>=6.12",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1",
    "djangorestframework-stubs>=3.18",
    "factory-boy>=3.3",
    "mypy>=2.4",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-cov>=7",
    "pytest-django>=4.14",
    "ruff>=0.16",
]

[tool.uv]
# This is an application, not an installable package.
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "DJ",      # flake8-django
    "S",       # bandit
    "C4",      # comprehensions
    "SIM",     # simplify
    "RUF",
]
ignore = ["S101"]  # assert is fine (tests)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["environ"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "-ra --strict-markers --reuse-db"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*"]
