# Hostinger VPS staging stack. Images are built by GitHub Actions and pulled from GHCR.
# Deployed by .github/workflows/deploy-staging.yml; see docs/deployment.md for first-time server setup.
name: alojeiri-staging

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:?set by the deploy workflow}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  web:
    # Caddy: serves the built SPA, terminates TLS (automatic HTTPS) and proxies the API.
    image: ${WEB_IMAGE:?set by the deploy workflow}
    restart: unless-stopped
    env_file: .env
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
